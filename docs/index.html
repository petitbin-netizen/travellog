<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelLog</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body data-page="list">
  <header class="topbar">
    <span class="logo">TravelLog</span>
    <div class="topbar-actions">
      <button id="btn-export-file" class="btn-ghost" title="모든 여행 기록을 records.js 파일로 내려받습니다 (다른 기기로 옮길 때 사용)">내보내기</button>
      <button id="btn-import-file" class="btn-ghost" title="내보낸 records.js 파일을 올려 이 브라우저의 기록을 덮어씁니다">불러오기</button>
      <input id="input-import-file" type="file" accept=".js,.json,text/javascript,application/json" hidden>
      <button id="btn-reload-file" class="btn-ghost" title="records.js 파일을 수정했다면, 브라우저 저장분을 지우고 파일 내용을 다시 불러옵니다">파일에서 다시 불러오기</button>
      <button id="btn-add-travel" class="btn-accent">+ Add Travel</button>
    </div>
  </header>
  <main id="app-root" class="grid"></main>

  <script src="data/records.js"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
